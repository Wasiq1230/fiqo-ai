# ─────────────────────────────────────────────────────────────
# Nginx config for the FIQO AI frontend.
#
#  - Serves the static SPA bundle
#  - Reverse-proxies /api/ and /health to the backend, so the whole app is ONE
#    public origin. The API container is never published: it is reachable only
#    on the private compose network. No cross-origin requests, no CORS surface,
#    and nobody can hit the API directly to bypass this layer.
#  - Security headers (see security-headers.conf), gzip, sensible caching
# ─────────────────────────────────────────────────────────────

# Don't advertise the nginx version in responses and error pages.
server_tokens off;

upstream FiQO_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # PDF uploads go up to MAX_UPLOAD_MB (default 15) and MAX_TOTAL_UPLOAD_MB
    # (default 50) for multi-file requests. Nginx's default cap is 1 MB, which
    # would reject almost every real lecture PDF with a 413 before the request
    # ever reached the backend. Keep this above the backend's own limit.
    client_max_body_size 55m;
    client_body_timeout  120s;

    include /etc/nginx/security-headers.conf;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── API reverse proxy ────────────────────────────────────
    location /api/ {
        proxy_pass         http://FiQO_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Preserves the true client IP so per-IP rate limiting is meaningful.
        # Requires TRUST_PROXY=true on the backend.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # AI generation legitimately takes a while; the default 60s read timeout
        # would cut long summaries off mid-flight with a 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
        # No add_header here, so the server-level security headers still apply.
    }

    location /health {
        proxy_pass       http://FiQO_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Long cache for content-hashed assets ─────────────────
    location /assets/ {
        include /etc/nginx/security-headers.conf;   # re-declared: see that file
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Never cache the entry HTML so deploys propagate immediately.
    location = /index.html {
        include /etc/nginx/security-headers.conf;   # re-declared: see that file
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # Never serve dotfiles, source maps or stray env files.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(map|env)$     { deny all; }

    # Local health endpoint for orchestrators (does not touch the API).
    location = /healthz {
        add_header Content-Type text/plain always;
        access_log off;
        return 200 "ok\n";
    }
}

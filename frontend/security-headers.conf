# ─────────────────────────────────────────────────────────────
# Shared security headers.
#
# This file exists because of an nginx rule that catches almost everyone:
# `add_header` directives are NOT merged with the parent block — declaring even
# one add_header inside a `location` DISCARDS every add_header inherited from
# `server`. Both `location = /index.html` and `location /assets/` set their own
# Cache-Control, which silently stripped the CSP, X-Frame-Options and
# nosniff headers from the main HTML document and every JS/CSS asset.
#
# So: include this file in the server block AND in every location that declares
# an add_header of its own.
# ─────────────────────────────────────────────────────────────

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "DENY"    always;
add_header Referrer-Policy        "no-referrer" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# connect-src is 'self' only: nginx proxies /api on this same origin, so the
# browser never makes a cross-origin request.
# fonts.googleapis.com / fonts.gstatic.com are required by the @import in
# src/index.css. Self-hosting those two font families would let you drop both
# entries and the third-party dependency with them.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Enable once HTTPS is terminated in front of this container:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
